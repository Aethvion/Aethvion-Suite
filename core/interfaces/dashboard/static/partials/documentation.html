<div class="panel-header borderless docs-panel-header">
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
        <div>
            <h2 class="status-header-title">Documentation</h2>
            <div class="status-meta">
                <span class="meta-primary" id="doc-view-meta">Repository Markdown Docs</span>
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
            <button class="doc-toolbar-btn" id="doc-refresh-btn" onclick="loadDocumentation(true)" title="Rescan repository .md files">
                <i class="fas fa-rotate-right"></i> Refresh
            </button>
        </div>
    </div>
</div>

<div class="docs-workspace" id="documentation-container">
    <div class="loading-placeholder">Scanning repository for .md files...</div>
</div>
