<div class="panel-header borderless">
                    <div class="panel-header-left">
                        <div class="panel-header-icon"><i class="fas fa-signal"></i></div>
                        <div class="panel-header-text">
                            <h2 class="panel-title status-header-title">System Status</h2>
                            <p class="panel-subtitle">
                                <span id="system-name-display">Aethvion Suite</span>
                                <span class="status-divider"> · </span>
                                <span id="system-version-display">__VERSION__</span>
                            </p>
                        </div>
                    </div>
                    <div class="panel-actions">
                        <div class="status-meta">
                            <span id="system-company-display" class="meta-primary"></span>
                            <a href="#" id="system-contact-display" class="meta-primary"
                               style="text-decoration: none; font-size: 0.78rem; color: var(--text-tertiary);"></a>
                        </div>
                    </div>
                </div>

                <div class="status-container">
                    <!-- Realtime Vitals Section -->
                    <div class="section-label">REALTIME VITALS <span class="live-indicator">● LIVE</span></div>
                    <div id="realtime-info-grid" class="status-telemetry-grid">
                        <!-- Populated by JS (CPU, RAM, Agents, Nexus) -->
                    </div>

                    <!-- Local System Info Section -->
                    <div class="section-header-row">
                        <div class="section-label">LOCAL SYSTEM INFO</div>
                        <div class="local-meta-right">
                            <span class="last-update" style="margin-right: 1rem;">LAST SYNC: <span
                                    id="telemetry-last-sync">--</span></span>
                            <button id="sync-telemetry-btn" class="icon-btn xs-btn" title="Sync Local Info" aria-label="Sync local system info"
                                onclick="syncSystemTelemetry()">
                                <i class="fas fa-sync" aria-hidden="true"></i> Sync
                            </button>
                        </div>
                    </div>
                    <div id="local-info-grid" class="status-telemetry-grid">
                        <!-- Populated by JS (Project Size, DB Size, Tools) -->
                    </div>

                    <!-- Extended Metadata Section -->
                    <div class="section-header-row" style="margin-top: 2.5rem;">
                        <div class="section-label">EXTENDED METADATA</div>
                    </div>
                    <div id="extended-info-grid" class="status-telemetry-grid extended">
                        <!-- Populated by JS (Git, Python, Platform, Models) -->
                        <div class="telemetry-card loading">
                            <div class="t-label">GIT LATEST</div>
                            <div class="t-value">Loading...</div>
                        </div>
                    </div>

                    <!-- Active Loops & Background Services Section -->
                    <div class="section-header-row" style="margin-top: 2.5rem;">
                        <div class="section-label" style="margin-bottom: 0;">
                            ACTIVE LOOPS &amp; BACKGROUND SERVICES
                            <span id="loops-summary-pill" class="loops-summary-pill">--</span>
                        </div>
                        <div class="local-meta-right" style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                            <button type="button" class="action-btn secondary xs-btn" id="loops-enable-companions-btn" title="Enable all Companion loops on startup">
                                <i class="fas fa-play"></i> Enable Optional on Startup
                            </button>
                            <button type="button" class="action-btn secondary xs-btn" id="loops-disable-optional-btn" title="Disable non-critical/optional loops on startup (e.g. if only using Automate)">
                                <i class="fas fa-power-off"></i> Minimal Mode (Disable Optional)
                            </button>
                        </div>
                    </div>
                    <div id="loops-filter-bar" class="loops-filter-bar">
                        <button type="button" class="loops-filter-btn active" data-filter="all">All</button>
                        <button type="button" class="loops-filter-btn" data-filter="critical">Critical</button>
                        <button type="button" class="loops-filter-btn" data-filter="standard">Standard</button>
                        <button type="button" class="loops-filter-btn" data-filter="optional">Optional</button>
                        <button type="button" class="loops-filter-btn" data-filter="running">Running</button>
                        <button type="button" class="loops-filter-btn" data-filter="stopped">Paused / Stopped</button>
                    </div>
                    <div id="active-loops-list" class="active-loops-list">
                        <div class="placeholder-text">Loading registered loops…</div>
                    </div>

                    <!-- Features Checklist -->
                    <div class="section-header-row">
                        <div class="section-label" style="margin-bottom: 0;">ROADMAP & FEATURES</div>
                        <div class="local-meta-right" style="display: flex; align-items: center; gap: 1rem;">
                            <span class="last-update" style="margin-right: 0;">UPDATED: <span
                                    id="status-last-update">--</span></span>
                            <button id="roadmap-view-toggle" class="action-btn secondary xs-btn"
                                onclick="toggleRoadmapView()" style="display: flex; gap: 0.4rem; align-items: center;">
                                <i class="fas fa-list"></i> Detailed View
                            </button>
                        </div>
                    </div>
                    <div class="roadmap-tree">
                        <div class="ae-loading">
                            <i class="fas fa-circle-notch fa-spin"></i>
                            <span>Loading system status…</span>
                        </div>
                    </div>
                </div>
