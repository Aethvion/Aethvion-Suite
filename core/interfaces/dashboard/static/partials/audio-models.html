<div class="hub-container">
    <!-- Premium Header -->
    <header class="hub-header">
        <div class="hub-header-main">
            <h1 class="hub-title">Audio &amp; Speech Models</h1>
            <p class="hub-subtitle">Install and manage local Text-to-Speech (TTS) and Speech-to-Text (STT) engines. Configure and clone voices in the Voice Library.</p>
        </div>
        <div class="hub-stats" style="display:flex; align-items:center; gap:1rem;">
            <div class="hub-stat-item">
                <span class="hub-stat-val">3</span>
                <span class="hub-stat-label">Models</span>
            </div>
            <button class="hub-action-btn secondary" onclick="if(typeof switchMainTab==='function') switchMainTab('voice-library')" style="white-space:nowrap;">
                <i class="fas fa-wave-square"></i> Open Voice Library
            </button>
        </div>
    </header>

    <!-- Tabbed Toolbar -->
    <div class="hub-toolbar" style="padding: 0.4rem;">
        <div class="am-tab-bar" style="display:flex; gap:0.25rem; width:100%;">
            <button class="am-tab-btn active" data-amtab="tts" onclick="AudioModels.switchTab('tts', this)">
                <i class="fas fa-volume-up"></i> Text to Speech (TTS)
            </button>
            <button class="am-tab-btn" data-amtab="stt" onclick="AudioModels.switchTab('stt', this)">
                <i class="fas fa-microphone"></i> Transcription (STT)
            </button>
        </div>
        <select id="am-compat-filter" class="lm-filter-select" title="Filter by PC Compatibility" style="margin-left:auto;">
            <option value="all">Hardware: All</option>
            <option value="runnable">Runnable on this PC</option>
            <option value="gpu">Runs on GPU</option>
            <option value="cpu">Runs on CPU</option>
        </select>
        <div id="am-hw-slot" style="margin-left:0.5rem;"></div>
        <button class="lm-icon-btn" onclick="AudioModels.refresh()" title="Refresh Registry">
            <i class="fas fa-rotate"></i>
        </button>
    </div>

    <!-- TTS Section -->
    <section id="am-section-tts" class="hub-provider-section">
        <div class="hub-provider-hd">
            <div class="hub-provider-dot" style="--brand-color: #a78bfa;"></div>
            <h2 class="hub-provider-name">Text to Speech Models</h2>
        </div>
        <div id="am-tts-cards" class="hub-grid">
            <div class="lm-store-loading"><i class="fas fa-circle-notch fa-spin"></i><span>Loading...</span></div>
        </div>
    </section>

    <!-- STT Section -->
    <section id="am-section-stt" class="hub-provider-section" style="display:none;">
        <div class="hub-provider-hd">
            <div class="hub-provider-dot" style="--brand-color: #fb923c;"></div>
            <h2 class="hub-provider-name">Speech to Text Models</h2>
        </div>
        <div id="am-stt-cards" class="hub-grid">
            <div class="lm-store-loading"><i class="fas fa-circle-notch fa-spin"></i><span>Loading...</span></div>
        </div>
    </section>
</div>

<style>
/* Audio Tab Styling */
.am-tab-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-tertiary);
    padding: 0.6rem 1rem;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
}
.am-tab-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-primary); }
.am-tab-btn.active {
    background: var(--hub-card-bg);
    color: var(--primary);
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
</style>
